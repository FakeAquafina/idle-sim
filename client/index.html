<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Idle Village</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="game"></div>

    <div id="hud">
    <div id="topbar" class="panel">
      <span id="status" class="dot connecting" title="connection"></span>
      <span id="clock">--:--</span>
      <span id="date">Day 1 of spring, year 1</span>
      <span id="weather">clear</span>
      <span id="speed" class="muted">1x</span>
      <span id="stock" class="muted"></span>
      <span id="ai" class="muted" title="Claude spend this hour / cap">🧠 –</span>
      <span id="viewers" class="muted" title="viewers">👁 0</span>
      <button id="chronicleBtn" class="small" title="Open the village chronicle">📜 0</button>
    </div>

    <div id="admin" class="panel hidden">
      <button data-cmd="pause">Pause</button>
      <button data-cmd="resume">Resume</button>
      <span class="sep"></span>
      <button data-speed="1">1x</button>
      <button data-speed="4">4x</button>
      <button data-speed="20">20x</button>
      <button data-speed="100">100x</button>
      <span class="sep"></span>
      <button data-cmd="reset" class="danger">Reset world</button>
      <span class="sep"></span>
      <button id="giftBtn" title="Drop resources at the storehouse">Gift…</button>
      <button id="rumorBtn" title="Whisper a rumor villagers will gossip about">Whisper…</button>
      <button id="aiBtn" title="Toggle Claude-driven villagers">AI: on</button>
      <button id="budgetBtn" title="Hourly spend cap">$/h</button>
      <span class="sep"></span>
      <button id="newsBtn" title="Travellers bring real-world headlines as gossip">News: on</button>
      <button id="storyBtn" title="Let the storyteller model write the chronicle">Chronicle: on</button>
      <button id="popBtn" title="No arrivals or births beyond this many villagers">Pop ≤ 12</button>
      <span id="adminMsg" class="muted"></span>
    </div>
    </div>

    <div id="inbox" class="panel">
      <div class="inbox-title">Shrine petitions <span id="inboxCount" class="muted"></span></div>
      <div id="inboxList"></div>
    </div>

    <div id="feed" class="panel"></div>

    <div id="chronicle" class="panel hidden">
      <button id="chronicleClose" class="close">×</button>
      <div class="inbox-title">The village chronicle</div>
      <div id="chronicleBody"></div>
    </div>

    <div id="inspector" class="panel hidden">
      <button id="inspectorClose" class="close">×</button>
      <div id="inspectorBody"></div>
    </div>

    <div id="hint" class="muted">drag to pan · scroll to zoom · click a villager</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
